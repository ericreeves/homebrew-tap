name: Bump mantle cask

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream release and bump cask
        run: |
          set -euo pipefail
          cask="Casks/mantle.rb"

          release=$(curl -fsSL https://api.github.com/repos/ghsteff/mantle/releases/latest)
          tag=$(echo "$release" | jq -r .tag_name)
          latest="${tag#tauri-v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")

          echo "upstream: $latest (tag $tag), cask: $current"
          if [ "$latest" = "$current" ]; then
            echo "Up to date."
            exit 0
          fi

          # Asset filenames don't track the tag version (e.g. Mantle_1.0.0_*.dmg
          # on tag tauri-v1.1.5), so discover them from the release itself.
          arm_name=$(echo "$release" | jq -r '.assets[].name | select(test("aarch64\\.dmg$"))')
          x64_name=$(echo "$release" | jq -r '.assets[].name | select(test("x64\\.dmg$"))')
          if [ -z "$arm_name" ] || [ -z "$x64_name" ]; then
            echo "ERROR: expected aarch64 + x64 .dmg assets on $tag, found:" >&2
            echo "$release" | jq -r '.assets[].name' >&2
            exit 1
          fi

          base="https://github.com/ghsteff/mantle/releases/download/$tag"
          curl -fsSL -o arm.dmg "$base/$arm_name"
          curl -fsSL -o x64.dmg "$base/$x64_name"
          arm_sha=$(sha256sum arm.dmg | cut -d' ' -f1)
          x64_sha=$(sha256sum x64.dmg | cut -d' ' -f1)
          rm -f arm.dmg x64.dmg

          # Rebuild the url template from the real asset name so a future
          # change to the inner filename version is picked up automatically.
          url_file=$(echo "$arm_name" | sed 's/aarch64/#{arch}/')

          sed -i \
            -e "s|^  version \".*\"|  version \"$latest\"|" \
            -e "s|^  sha256 arm:   \".*\",|  sha256 arm:   \"$arm_sha\",|" \
            -e "s|^         intel: \".*\"|         intel: \"$x64_sha\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/ghsteff/mantle/releases/download/tauri-v#{version}/$url_file\"|" \
            "$cask"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$cask"
          git commit -m "mantle: bump $current -> $latest"
          git push
